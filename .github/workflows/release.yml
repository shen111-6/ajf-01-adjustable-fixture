name: Publish verified portfolio release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify portfolio
        run: python tools/check_delivery.py
      - name: Package manifest files
        run: |
          python - <<'PY'
          import pathlib,json,zipfile,hashlib
          root=pathlib.Path('.')
          names=[x['path'] for x in json.loads((root/'manifest.json').read_text())['files']]+['manifest.json']
          with zipfile.ZipFile('AJF01-v1.0.1.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in sorted(names):
                  archive.write(root/name,name)
          p=root/'AJF01-v1.0.1.zip'
          (root/'SHA256SUMS.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          PY
      - name: Publish v1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1 AJF01-v1.0.1.zip SHA256SUMS.txt --target "$GITHUB_SHA" --title "AJF-01 v1.0.1 — 可调式桌面检验夹具" --notes "AI辅助个人机械设计与软件验证项目。包含SolidWorks原生模型、三个装配、六张DWG、STEP、BOM、计算、软件验证记录及简历材料。软件几何与文件完整性已验证，未制造实物，未进行物理精度或载荷试验。"
